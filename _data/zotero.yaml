- id: adangJewishReplyIbn2002
  abstract: >-
    This article deals with, and presents sections from a tract written by the
    Barcelonan rabbi, Ibn Adret (d. 1310), in refutation of the arguments that
    had been raised more than two hundred years earlier by the famous Andalusi
    writer, Ibn Ḥazm (d. 1064), against Judaism in general, and against the
    Torah in particular. Ibn Adret’s intended readers were either Jews living
    under Muslim rule, or Jewish rationalists to whom the Muslim writer’s
    criticism of the Hebrew Bible might have appealed,Este artículo estudia el
    caso y presenta secciones de un libelo escrito por el rabino barcelonés Ibn
    Adret (m. en 1310) para refutar los argumentos propuestos, más de doscientos
    años antes, por el célebre escritor andalusí Ibn Ḥazm (m. en 1064) contra el
    judaísmo en general y particularmente contra la Tora. Los destinatarios del
    texto de Ibn Adret eran tanto judíos que vivían bajo la dominación musulmana
    como judíos racionalistas a los que podía seducir la actitud crítica
    adoptada por el escritor musulmán respecto a la Biblia hebraica,Cet article
    étudie le cas et présente des sections d’un libelle écrit par le rabbin
    barcelonais Ibn Adret (m. 1310) pour réfuter les arguments avancés, plus de
    deux cents ans plus tôt, par le fameux écrivain d’al-Andalus Ibn Ḥazm (m.
    1064) contre le judaïsme en général et particulièrement contre la Torah. Les
    lecteurs auxquels Ibn Adret destinait son texte étaient soit des juifs
    vivant sous la domination musulmane, soit des juifs rationalistes qui
    auraient pu être séduits par l’attitude critique adoptée par l’écrivain
    musulman à l’égard de la Bible hébraïque
